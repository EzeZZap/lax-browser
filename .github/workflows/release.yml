# Builds signed release APKs for a version tag (v0.1.0, ...) and attaches them to a GitHub release.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   LAX_KEYSTORE_BASE64    base64 of lax-release.jks   (PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes("lax-release.jks")))
#   LAX_KEYSTORE_PASSWORD  storePassword from keystore.properties
#   LAX_KEY_ALIAS          keyAlias (lax)
#   LAX_KEY_PASSWORD       keyPassword from keystore.properties
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Check that the tag matches versionName
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match versionName $version" >&2
            exit 1
          fi

      - name: Restore the signing key
        env:
          LAX_KEYSTORE_BASE64: ${{ secrets.LAX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$LAX_KEYSTORE_BASE64" ]; then echo "The LAX_KEYSTORE_BASE64 secret is missing" >&2; exit 1; fi
          echo "$LAX_KEYSTORE_BASE64" | base64 --decode > lax-release.jks

      - name: Test and build signed APKs
        env:
          LAX_KEYSTORE: lax-release.jks
          LAX_KEYSTORE_PASSWORD: ${{ secrets.LAX_KEYSTORE_PASSWORD }}
          LAX_KEY_ALIAS: ${{ secrets.LAX_KEY_ALIAS }}
          LAX_KEY_PASSWORD: ${{ secrets.LAX_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease -PlaxUpdateRepo=${{ github.repository }} --stacktrace

      - name: Remove the signing key
        run: rm -f lax-release.jks

      # A release APK must start on a device before it is published (R8 can break startup).
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start the release APK on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            chmod +x .github/scripts/smoke-test.sh
            .github/scripts/smoke-test.sh app/build/outputs/apk/release/app-x86_64-release.apk

      - name: Keep the R8 mapping (to read crash logs from this release)
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping-${{ github.ref_name }}
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 90

      - name: Name the APKs after the version
        run: |
          mkdir -p dist
          for apk in app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$apk" | sed 's/app-\(.*\)-release.apk/\1/')
            cp "$apk" "dist/lax-${GITHUB_REF_NAME}-${abi}.apk"
          done
          ls -l dist

      - name: Remove the signing key if a step failed
        if: failure()
        run: rm -f lax-release.jks

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
