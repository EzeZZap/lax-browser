# Every push to main and every pull request:
#   build   unit tests, lint, debug builds, and an R8 release build (debug-signed)
#   device  on an Android emulator: starts the release APK (smoke-test.sh), then runs the
#           instrumented tests (Gecko container isolation, database migrations, UI)
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint, debug builds, and a release build
        run: |
          chmod +x gradlew
          ./gradlew testGithubDebugUnitTest lintGithubDebug assembleGithubDebug assembleFdroidDebug \
            assembleGithubRelease -PlaxDebugSignRelease=true --stacktrace

      - name: Release APK for the emulator check
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/github/release/app-github-x86_64-release.apk

      - name: R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/githubRelease/
          if-no-files-found: ignore

      - name: Test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-githubDebug.*
          if-no-files-found: ignore

  device:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: release-apk

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The update checker is off (empty laxUpdateRepo) so no GitHub dialog interrupts UI tests.
      - name: Release smoke test and instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            chmod +x gradlew .github/scripts/smoke-test.sh
            .github/scripts/smoke-test.sh release-apk/app-github-x86_64-release.apk
            adb uninstall com.javzzap.laxbrowser || true
            ./gradlew connectedGithubDebugAndroidTest -PlaxUpdateRepo= --stacktrace

      - name: Instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
